<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Medical Inventory Management System</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // If already authenticated, redirect immediately to dashboard
    if (sessionStorage.getItem('loggedIn') === 'true') {
      window.location.replace('index.html');
    }
  </script>
</head>
<body class="login-body">

  <div class="login-split-container">
    <!-- Left Hero Illustration Panel -->
    <div class="login-artwork-panel">
      <div class="login-artwork-crop">
        <img src="assets/hero-illustration.png" alt="Medical Inventory System" class="login-hero-img">
      </div>
    </div>

    <!-- Right Login Form Panel -->
    <div class="login-form-panel">
      <div class="login-card">
        <!-- Brand Header -->
        <div class="login-brand">
          <div class="brand-icon">
            <svg class="icon" width="22" height="22" aria-hidden="true"><use href="assets/icons.svg#shield-plus"></use></svg>
          </div>
          <div>
            <h1 class="brand-title">Medical Inventory System</h1>
            <p class="brand-subtitle">Smart FEFO Pharmacy &amp; Stock Control</p>
          </div>
        </div>

        <h2 class="login-heading">Login</h2>

        <!-- Inline Error Banner -->
        <div id="login-error-msg" class="login-error-banner" style="display: none;">
          <svg class="icon" width="16" height="16" aria-hidden="true"><use href="assets/icons.svg#alert-circle"></use></svg> Invalid username or password
        </div>

        <!-- Login Form -->
        <form id="form-login" onsubmit="event.preventDefault(); handleLoginSubmit(event);">
          <div class="form-group">
            <label class="form-label" for="login-username">Username</label>
            <input type="text" id="login-username" class="form-control" placeholder="Enter username" required autocomplete="username" autofocus>
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <div class="password-input-wrap">
              <input type="password" id="login-password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
              <button type="button" class="btn-toggle-password" onclick="togglePasswordVisibility()" title="Toggle password visibility" aria-label="Toggle password visibility">
                <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" id="btn-login" class="btn btn-primary btn-block">
            <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#log-in"></use></svg> Login
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="login.js"></script>
  <script src="ui.js"></script>
</body>
</html>
